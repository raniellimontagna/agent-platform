global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://10.10.0.11:3000/health
        labels:
          service: orchestrator-api
      - targets:
          - http://10.10.0.10:4000/health/liveliness
        labels:
          service: litellm-gateway
      - targets:
          - http://10.10.0.12:8080/health
        labels:
          service: agent-runners
      - targets:
          - http://grafana:3000/api/health
        labels:
          service: grafana
      - targets:
          - http://loki:3100/ready
        labels:
          service: loki
      - targets:
          - http://prometheus:9090/-/healthy
        labels:
          service: prometheus
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: node
    static_configs:
      - targets: ["10.10.0.11:9100"]
        labels:
          service: orchestrator-lxc-201
      - targets: ["10.10.0.12:9100"]
        labels:
          service: runners-vm-202

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: orchestrator-postgres
