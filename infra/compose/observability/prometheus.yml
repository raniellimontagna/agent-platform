global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ["<agent-orchestrator-ip>:3000"]
        labels:
          service: orchestrator-api

  - job_name: gateway
    static_configs:
      - targets: ["<agent-gateway-ip>:4000"]
        labels:
          service: litellm-gateway

  - job_name: runners
    static_configs:
      - targets: ["<agent-runners-ip>:8080"]
        labels:
          service: agent-runners
