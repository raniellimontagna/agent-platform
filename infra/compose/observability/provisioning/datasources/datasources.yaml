apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Banco do orchestrator (.11) — fonte do histórico de runs (MAC-35/36).
  - name: Orchestrator Postgres
    uid: orchestrator_pg
    type: postgres
    access: proxy
    url: 10.10.0.11:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
