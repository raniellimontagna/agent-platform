services:
  api:
    image: agent-platform/orchestrator-api:latest
    build:
      context: ../../..
      dockerfile: apps/orchestrator-api/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET}
      LINEAR_API_KEY: ${LINEAR_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RUNNER_BASE_URL: ${RUNNER_BASE_URL}
      RUNNER_BASE_URLS: ${RUNNER_BASE_URLS}
      RUNNER_AUTH_TOKEN: ${RUNNER_AUTH_TOKEN}
      REPO_URL: ${REPO_URL}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-UTC}
      LINEAR_SCHEDULED_LABEL_ID: ${LINEAR_SCHEDULED_LABEL_ID}
      AGENT_KEY: ${AGENT_KEY:-coder-agent}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-3}
      HF_HOME: /opt/hf-cache
    volumes:
      - /opt/agent-platform/orchestrator:/app/data
      - /opt/agent-platform/logs:/app/logs
      - /opt/agent-platform/hf-cache:/opt/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Exposto na subnet isolada vmbr1 p/ o Grafana (.13) ler runs/run_steps (MAC-35).
    ports:
      - "5432:5432"
    volumes:
      - /opt/agent-platform/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /opt/agent-platform/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
