services:
  api:
    image: agent-platform/orchestrator-api:latest
    build:
      context: ../../..
      dockerfile: apps/orchestrator-api/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      CARD_PRIMARY_PROVIDER: ${CARD_PRIMARY_PROVIDER:-plane}
      CARD_EXTRA_PROVIDERS: ${CARD_EXTRA_PROVIDERS:-}
      PLANE_BASE_URL: ${PLANE_BASE_URL}
      PLANE_API_KEY: ${PLANE_API_KEY}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-attodev}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID}
      PLANE_WEBHOOK_SECRET: ${PLANE_WEBHOOK_SECRET}
      PLANE_AI_READY_LABEL_ID: ${PLANE_AI_READY_LABEL_ID}
      PLANE_APPROVED_LABEL_ID: ${PLANE_APPROVED_LABEL_ID}
      PLANE_AUTO_MERGE_LABEL_ID: ${PLANE_AUTO_MERGE_LABEL_ID}
      PLANE_SCHEDULED_LABEL_ID: ${PLANE_SCHEDULED_LABEL_ID}
      PLANE_DONE_STATE_ID: ${PLANE_DONE_STATE_ID}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET}
      LINEAR_API_KEY: ${LINEAR_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GENERATED_REPOS_OWNER: ${GENERATED_REPOS_OWNER:-attodevlabs}
      GENERATED_REPOS_TOKEN: ${GENERATED_REPOS_TOKEN}
      GENERATED_REPOS_TEMPLATE: ${GENERATED_REPOS_TEMPLATE}
      GENERATED_REPOS_ALLOW_CREATE: ${GENERATED_REPOS_ALLOW_CREATE:-false}
      CLOUDFLARE_DEPLOY_GENERATED_LANDINGS: ${CLOUDFLARE_DEPLOY_GENERATED_LANDINGS:-false}
      CLOUDFLARE_DEPLOY_COMMANDS: ${CLOUDFLARE_DEPLOY_COMMANDS:-pnpm install --frozen-lockfile\npnpm deploy:cloudflare}
      RUNNER_BASE_URL: ${RUNNER_BASE_URL}
      RUNNER_BASE_URLS: ${RUNNER_BASE_URLS}
      RUNNER_AUTH_TOKEN: ${RUNNER_AUTH_TOKEN}
      REPO_URL: ${REPO_URL}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-UTC}
      LINEAR_SCHEDULED_LABEL_ID: ${LINEAR_SCHEDULED_LABEL_ID}
      AGENT_KEY: ${AGENT_KEY:-coder-agent}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-3}
      LINEAR_AUTO_MERGE_LABEL_ID: ${LINEAR_AUTO_MERGE_LABEL_ID}
      LINEAR_DONE_STATE_ID: ${LINEAR_DONE_STATE_ID:-79e3b949-6f1f-469d-902d-71d135d18cae}
      # MAC-45: modelo de embedding é baked na imagem (/app/.hf-cache, ver Dockerfile)
      # — sem download em runtime nem volume. HF_HOME só p/ override manual.
    volumes:
      - /opt/agent-platform/orchestrator:/app/data
      - /opt/agent-platform/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Exposto na subnet isolada vmbr1 p/ o Grafana (.13) ler runs/run_steps (MAC-35).
    ports:
      - "5432:5432"
    volumes:
      - /opt/agent-platform/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /opt/agent-platform/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
