# Backend híbrido:
#  - Verboo (API key direta): aliases de alto volume / baixo custo.
#  - OmniRoute (bridge OAuth das assinaturas): aliases fortes (Claude/GPT).
#
# OmniRoute expõe endpoint OpenAI-compatible em http://omniroute:20128/v1
# (mesma rede do compose). Prefixos de modelo do OmniRoute:
#   cc/...  = Claude (assinatura Claude Max)
#   cx/...  = GPT/Codex (assinatura ChatGPT)
# Confirme os nomes exatos em Dashboard → Models do OmniRoute
# (http://10.10.0.10:20128) e ajuste abaixo.

model_list:
  # --- Verboo: alto volume / barato (endpoint OpenAI-compatible) --------
  # 'openai/<modelo>' faz o LiteLLM tratar como endpoint OpenAI custom.
  # Ajuste <modelo> e VERBOO_API_BASE conforme a conta Verboo.
  - model_name: cheap_fast
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE

  - model_name: research
    litellm_params:
      model: openai/mimo-v2.5
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE

  # --- OmniRoute (OAuth): qualidade / código ----------------------------
  - model_name: strong_coder
    litellm_params:
      model: openai/cc/claude-sonnet
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  - model_name: critic
    litellm_params:
      model: openai/cc/claude-sonnet
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
