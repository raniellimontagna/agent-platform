# Aliases roteados via OmniRoute (bridge OAuth das assinaturas).
# OmniRoute expõe endpoint OpenAI-compatible em http://omniroute:20128/v1
# (mesma rede do compose). Prefixos de modelo do OmniRoute:
#   cc/...  = Claude (via assinatura Claude Max)
#   cx/...  = GPT/Codex (via assinatura ChatGPT)
#   auto    = roteamento automático do OmniRoute
#
# IMPORTANTE: confirme os nomes exatos dos modelos em
# Dashboard → Models do OmniRoute (http://10.10.0.10:20128) e ajuste abaixo.

model_list:
  - model_name: cheap_fast
    litellm_params:
      model: openai/cc/claude-haiku
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  - model_name: strong_coder
    litellm_params:
      model: openai/cc/claude-sonnet
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  - model_name: critic
    litellm_params:
      model: openai/cc/claude-sonnet
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  - model_name: research
    litellm_params:
      model: openai/cx/gpt-4o
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
