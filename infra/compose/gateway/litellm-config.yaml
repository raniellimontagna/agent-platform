model_list:
  - model_name: cheap_fast
    litellm_params:
      model: verboo/verboo-default
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE

  - model_name: strong_coder
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    fallback:
      - model_name: strong_coder_fallback
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY

  - model_name: critic
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: research
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
