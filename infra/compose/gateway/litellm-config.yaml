# Cérebro de roteamento = LiteLLM (budgets, rate-limits, logs).
# OmniRoute = bridge OAuth + combos de modelos.
#
# Regra de responsabilidade:
# - LiteLLM expõe aliases estáveis para os agentes.
# - OmniRoute resolve fallback interno dos combos cost-saver/high-availability.
# - Não duplicar cadeia de fallback de modelos nos dois lugares.
#
# 'openai/<id>' faz o LiteLLM mandar <id> ao endpoint (OmniRoute ou Verboo).
# Os combos abaixo precisam existir no OmniRoute com estes aliases:
# - combo/cost-saver
# - combo/high-availability

model_list:
  # --- cheap_fast: Verboo direto; fallback para o combo barato -----------
  - model_name: cheap_fast
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE
      rpm: 30
      tpm: 60000
  - model_name: cheap_fast_fb_cost_saver
    litellm_params:
      model: openai/combo/cost-saver
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://omniroute:20128/v1
      rpm: 12
      tpm: 40000

  # --- combos OAuth: reserva para quando OmniRoute estiver saudável -------
  - model_name: research_fb_cost_saver
    litellm_params:
      model: openai/combo/cost-saver
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://omniroute:20128/v1
      rpm: 12
      tpm: 80000
  - model_name: strong_coder_fb_cost_saver
    litellm_params:
      model: openai/combo/cost-saver
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://omniroute:20128/v1
      rpm: 8
      tpm: 60000
  - model_name: heavy_coder_fb_high_availability
    litellm_params:
      model: openai/combo/high-availability
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://omniroute:20128/v1
      rpm: 4
      tpm: 50000
  - model_name: critic_fb_high_availability
    litellm_params:
      model: openai/combo/high-availability
      api_key: os.environ/OMNIROUTE_API_KEY
      api_base: http://omniroute:20128/v1
      rpm: 6
      tpm: 50000

  # --- Verboo direto: padrão operacional enquanto OAuth combos degradam ---
  # Verboo tem cota alta, mas modelo menor/menos "thinking". Mantém a
  # plataforma disponível; revisar resultados com mais cuidado.
  - model_name: research
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE
      rpm: 20
      tpm: 60000
  - model_name: strong_coder
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE
      rpm: 20
      tpm: 60000

  # --- tarefas críticas e revisão final ---------------------------------
  - model_name: heavy_coder
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE
      rpm: 12
      tpm: 50000
  - model_name: critic
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/VERBOO_API_KEY
      api_base: os.environ/VERBOO_API_BASE
      rpm: 12
      tpm: 50000

litellm_settings:
  drop_params: true
  request_timeout: 45
  num_retries: 0
  max_budget: 25.0
  budget_duration: 30d

router_settings:
  # Fallback é responsabilidade do Router. Timeouts curtos evitam ficar preso
  # em combo OAuth degradado e deixam Verboo assumir como cota de segurança.
  timeout: 45
  num_retries: 0
  fallbacks:
    - cheap_fast: ["cheap_fast_fb_cost_saver"]
    - research: ["research_fb_cost_saver"]
    - strong_coder: ["strong_coder_fb_cost_saver"]
    - heavy_coder: ["heavy_coder_fb_high_availability"]
    - critic: ["critic_fb_high_availability"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Config versionada é a fonte da verdade; modelos persistidos mantiveram rotas
  # antigas para OmniRoute mesmo após deploy do YAML.
  store_model_in_db: false
