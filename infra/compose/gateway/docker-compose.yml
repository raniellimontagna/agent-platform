services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/agent-platform/caddy/data:/data
      - /opt/agent-platform/caddy/config:/config
    depends_on:
      - litellm

  # Bridge OAuth: segura as assinaturas (Claude Max, ChatGPT) e expõe um
  # endpoint OpenAI-compatible. OAuth feito na web UI (porta 20128).
  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      # Volume nomeado (não bind): o OmniRoute roda como não-root e precisa
      # de permissão de escrita em /app/data, que o bind root:root não dá.
      - omniroute-data:/app/data

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VERBOO_API_KEY: ${VERBOO_API_KEY}
      VERBOO_API_BASE: ${VERBOO_API_BASE}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      STORE_MODEL_IN_DB: "false"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /opt/agent-platform/litellm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  omniroute-data:
