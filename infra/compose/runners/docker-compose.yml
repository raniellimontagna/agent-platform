services:
  runner-api:
    image: agent-platform/worker-code:latest
    build:
      context: ../../..
      dockerfile: apps/worker-code/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      RUNNER_WORKDIR: /srv/agent-runners/worktrees
      RUNNER_ARTIFACTS_DIR: /srv/agent-runners/artifacts
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL}
      RUNNER_AUTH_TOKEN: ${RUNNER_AUTH_TOKEN}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-agent-platform bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-bot@agent.local}
      GIT_COAUTHOR_NAME: ${GIT_COAUTHOR_NAME:-}
      GIT_COAUTHOR_EMAIL: ${GIT_COAUTHOR_EMAIL:-}
      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-docker}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-agent-platform/worker-code:latest}
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-bridge}
      AGENT_SANDBOX_CPUS: ${AGENT_SANDBOX_CPUS:-2}
      AGENT_SANDBOX_MEMORY: ${AGENT_SANDBOX_MEMORY:-2g}
      AGENT_SANDBOX_PIDS_LIMIT: ${AGENT_SANDBOX_PIDS_LIMIT:-512}
    volumes:
      - /srv/agent-runners/worktrees:/srv/agent-runners/worktrees
      - /srv/agent-runners/artifacts:/srv/agent-runners/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
