services:
  runner-api:
    image: agent-platform/worker-code:latest
    build:
      context: ../../..
      dockerfile: apps/worker-code/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      RUNNER_WORKDIR: /srv/agent-runners/worktrees
      RUNNER_ARTIFACTS_DIR: /srv/agent-runners/artifacts
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL}
      RUNNER_AUTH_TOKEN: ${RUNNER_AUTH_TOKEN}
    volumes:
      - /srv/agent-runners/worktrees:/srv/agent-runners/worktrees
      - /srv/agent-runners/artifacts:/srv/agent-runners/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
